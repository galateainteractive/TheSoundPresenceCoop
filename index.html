<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>The Sound Presence Coop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">

    <script src="manual.js?v=20260829-2" charset="utf-8"></script>
    <style>
        /* --- ESTILO GERAL --- */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            color: #fff;
            font-family: 'Science Gothic', sans-serif; /* FONTE NOVA */
            font-size: 14px;

            overflow-x: hidden;
            /* IMAGEM DE FUNDO */
            background-image: url('FundoEscuroPartitulas.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        #menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }


        .menu-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(540px, 90vw);
            margin: 0;
        }

        .menu-logo {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 2.5;
            overflow: hidden;
        }

        .menu-logo img {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 126%;
            max-width: none;
            height: auto;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.75));
        }

        .menu-subtitle {
            margin-top: 6px;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.5em;
        }

        #player-screen {
            display: none;
            height: 100%;
            padding: 0;
            box-sizing: border-box;
            /* SUA NOVA IMAGEM SÓ PARA A PARTE DE DENTRO: */
            background-image: url('AcoEscovado.png');
            background-size: cover;
            background-position: center;
        }

        .comp-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 800px;
            margin-top: 30px;
        }

        .comp-card {
            border: 1px solid #fff;
            padding: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .module-heading {
            grid-column: 1 / -1;
            margin: 20px 0 0;
            text-align: left;
            font-size: 16px;
        }

            .comp-card:hover {
                background: #fff;
                color: #000;
            }

        .main-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .top-panel {
            flex-shrink: 0;
            max-height: 55vh;
            overflow-y: auto;
            border-bottom: 4px solid #fff;
            padding: 15px 27px 15px 15px;
            box-sizing: border-box;
            /* IMAGEM DO TOPO + EFEITO FUMÊ DE 60% PARA LER OS TEXTOS */
            background-image: url('FundoEscuroPartitulas.png');
            background-size: cover;
            background-position: center;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .back-btn {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 5px 10px;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            font-size: 10px;
        }

        .help-btn {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 5px 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 14px;
        }

            .help-btn:hover {
                background: #fff;
                color: #000;
            }

        /* --- CONTROLES SCOPE --- */
        .scope-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            margin: 0 0 10px 0;
            border: 1px solid #222;
            padding: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 10px;
            text-transform: uppercase;
            flex: 1;
            min-width: 90px;
        }

        input[type=range] {
            width: 100%;
            height: 20px;
            accent-color: #fff;
            cursor: pointer;
        }

        .control-disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(100%);
        }

        .zoom-warning {
            color: #ff9900;
            font-size: 10px;
            font-weight: bold;
            margin-top: 5px;
            display: none;
            text-shadow: 0 0 5px #ff9900;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        /* --- BARRA GROOVE --- */
        .groove-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 5px;
            padding: 10px 5px 0 5px;
            border-top: 1px dashed #333;
            gap: 20px;
        }

        .groove-control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            text-transform: uppercase;
            text-align: right;
        }

            .groove-control-group input {
                width: 100px;
                margin-left: 5px;
            }

        .play-groove-btn {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 8px 15px;
            font-family: inherit;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            white-space: nowrap;
        }

            .play-groove-btn:active {
                background: #333;
            }

        .groove-playing {
            background: #fff;
            color: #000;
            border-color: #000;
        }

        /* --- CANVAS --- */
        .top-panel .canvas-container {
            position: relative;
            width: 100%;
            height: 100px;
            background: #000;
            display: flex;
            align-items: center;
        }

        .top-panel canvas {
            border: 2px solid #fff;
            background: #000;
            box-sizing: border-box;
        }

        .tracks-scroll {
            flex: 1;
            overflow-y: auto;
            background: rgba(20, 20, 20, 0.4); /* Fundo escuro leve */
            color: #fff;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }

            .tracks-scroll::-webkit-scrollbar {
                width: 12px;
                background: #000;
                border-left: 1px solid #333;
            }

            .tracks-scroll::-webkit-scrollbar-thumb {
                background: #fff;
                border: 2px solid #000;
            }

            .tracks-scroll .canvas-container {
                position: relative;
                width: 100%;
                height: 100px;
                display: flex;
                align-items: center;
            }

            .tracks-scroll canvas {
                border: 2px solid #000;
                background: #fff;
                display: block;
                box-sizing: border-box;
            }

        .track-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* Afastei um pouco as bordas para o texto não grudar na imagem */
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #666;
            border-radius: 8px; /* Cantos levemente arredondados para dar cara de "card" */
            /* AQUI ENTRA A SUA IMAGEM (com aquele fumê de leve pra não sumir com as letras) */
            background-image: url('AcoEscovado.png');
            background-size: cover;
            background-position: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        .track-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-label {
            font-size: 9px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .tracks-scroll .track-label {
            color: #000;
        }

        .top-panel .track-label {
            color: #888;
        }

        .cursor-groove {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background: #fff;
            pointer-events: none;
            display: none;
            z-index: 10;
            box-shadow: 0 0 5px #fff;
        }

        .btn-group {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .btn {
            cursor: pointer;
            padding: 12px 10px;
            font-size: 10px;
            text-transform: uppercase;
            flex: 1;
            text-align: center;
            /* BOTÕES TRANSPARENTES COM TEXTO E BORDA BRANCA */
            background: transparent !important;
            color: #fff !important;
            border: 1px solid #fff !important;
            transition: 0.3s; /* Deixa a mudança de cor suave quando passar o mouse */
        }

            /* Efeito quando clica ou passa o mouse em cima do botão */
            .btn:hover, .btn:active {
                background: rgba(255, 255, 255, 0.2) !important; /* Fica um branco bem transparente */
            }

        /* --- BOTÕES DAS TRACKS (Transparente com contorno preto) --- */
        .tracks-scroll .btn {
            background: transparent !important; /* Fundo invisível */
            color: #000 !important; /* Texto preto */
            border: 1px solid #000 !important; /* Borda preta */
            font-weight: bold;
            transition: 0.3s;
        }

            /* Efeito APENAS ao tocar na tela (Ideal para Celular) */
            .tracks-scroll .btn:active {
                background: #000 !important;
                color: #fff !important;
            }

            /* Mantém o botão de sincronia marcado visualmente (agora com força total!) */
            .tracks-scroll .btn.sync-active {
                background: #000 !important;
                color: #fff !important;
            }


            /* Classe ativada via JavaScript enquanto a track estiver tocando */
            .tracks-scroll .btn.track-playing {
                background: #000 !important;
                color: #fff !important;
            }

        /* Estilo específico do botão de Pause (para diferenciar do Play) */
        .btn-pause {
            background: transparent !important;
            border-color: #555 !important; /* Borda cinza escuro */
            color: #555 !important; /* Texto cinza escuro */
            display: none;
        }

        #liveScope {
            width: 100%;
            height: 80px;
            border: 1px solid #555;
            background: #000;
            cursor: grab;
        }

            #liveScope:active {
                cursor: grabbing;
            }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: #fff;
        }

        /* --- HELP OVERLAY --- */
        #help-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 999;
            display: none;
            overflow-y: auto;
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
        }

        .help-section {
            margin-bottom: 30px;
            border-bottom: 1px dashed #444;
            padding-bottom: 20px;
        }

        .help-language-switch {
            display: flex;
            gap: 8px;
            margin: 10px 0 14px 0;
        }

        .help-language-btn {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 6px 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
        }

        .help-language-btn.active {
            background: #fff;
            color: #000;
        }

        .help-box {
            border: 1px solid #fff;
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(20,20,20,0.95);
            position: relative;
        }

        .help-title-main {
            color: #fff;
            font-size: 16px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            border: 2px solid #fff;
            display: inline-block;
            padding: 5px 10px;
        }

        .help-subtitle {
            color: #aaa;
            font-size: 11px;
            margin-top: 5px;
            margin-bottom: 15px;
            max-width: 600px;
        }

        .help-box h3 {
            margin: 0 0 10px 0;
            color: #ffff00;
            text-transform: uppercase;
            font-size: 13px;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
            letter-spacing: 1px;
        }

        .help-box p {
            font-size: 11px;
            line-height: 1.5;
            margin: 8px 0;
            color: #ddd;
        }

        .help-box strong {
            color: #fff;
            font-weight: bold;
        }

        .help-formula {
            background: #222;
            padding: 8px;
            font-family: monospace;
            text-align: center;
            margin: 10px 0;
            border: 1px solid #666;
            font-size: 11px;
            color: #0f0;
        }

        .cheat-sheet {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
            margin-top: 10px;
            color: #aaa;
            font-family: monospace;
        }

            .cheat-sheet td, .cheat-sheet th {
                border: 1px solid #444;
                padding: 6px 4px;
                text-align: center;
            }

            .cheat-sheet th {
                color: #fff;
                background: #222;
            }

            .cheat-sheet tr:nth-child(even) {
                background: #111;
            }

        /* --- CLASSES FANTASMAS PARA ALINHAMENTO --- */
        .ghost-block {
            visibility: hidden;
            pointer-events: none;
        }

        @media (max-width: 767px) {
            .ghost-block {
                display: none !important;
            }
        }

        @media (min-width: 768px) {
            .track-row {
                flex-direction: row;
                align-items: center;
            }

            .track-info {
                display: contents;
            }

            .track-label {
                width: 150px;
                text-align: right;
                margin-right: 15px;
            }

            .canvas-container {
                width: 600px;
            }

            .btn-group {
                margin-top: 0;
            }

            .btn {
                flex: none;
                min-width: 100px;
            }
        }

        /* Ajustes para telas com pouca altura vertical (celulares) */
        @media (max-height: 700px) {
            .top-panel .canvas-container, .tracks-scroll .canvas-container {
                height: 80px !important;
            }

            #liveScope {
                height: 60px !important;
            }

            .groove-toolbar {
                margin-top: 5px;
                padding-top: 5px;
            }

            .scope-controls {
                gap: 5px;
                padding: 5px;
            }

            .control-group {
                min-width: 70px;
            }

            .top-panel {
                padding: 8px;
            }
        }
        /* --- SESSIONS NAV (Botões de Sessão) --- */
        .session-nav {
            display: flex;
            justify-content: center;
            gap: 4px; /* ERA 10px: Aproximamos os botões para economizar espaço */
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
        }

        .session-btn {
            background: #000;
            color: #666;
            border: 1px solid #333;
            padding: 5px 6px; /* ERA 5px 10px: Deixamos o botão um pouquinho mais magro */
            cursor: pointer;
            font-family: inherit;
            font-size: 9px; /* ERA 10px: Reduzimos um pontinho para compensar a largura da fonte */
            text-transform: uppercase;
        }

            .session-btn:hover {
                border-color: #fff;
                color: #fff;
            }

            .session-btn.active {
                background: #fff;
                color: #000;
                border-color: #fff;
                font-weight: bold;
            }

        /* --- ESTILO DA MASTER TRACK (O "BOSS") --- */
        .master-track-container {
            margin-top: 40px;
            margin-bottom: 50px;
            padding: 10px;
        }

        .master-locked {
            border: 2px dashed #444;
            background: #0a0a0a;
            padding: 30px;
            text-align: center;
            color: #666;
            font-family: monospace;
            letter-spacing: 1px;
        }

        .master-input {
            background: #000;
            border: 1px solid #666;
            color: #fff;
            padding: 8px;
            font-size: 14px;
            width: 80px;
            text-align: center;
            letter-spacing: 3px;
            margin-left: 10px;
            text-transform: uppercase;
        }

        .master-unlocked {
            border: 4px double #fff;
            background: #000;
            padding: 15px;
            position: relative;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .master-title {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: #fff;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        /* Garante que o botão do Boss não fique camuflado no fundo preto */
        #masterPlayBtn {
            color: #fff !important;
            border: 1px solid #fff !important;
            background: #000 !important;
        }

            /* Efeito visual quando tocar no botão do Boss */
            #masterPlayBtn:active {
                background: #fff !important;
                color: #000 !important;
            }

        /* --- HEADER ROW (Título + Botão Full) --- */
        .header-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px; /* Espaço entre título e botão */
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        #playing-title {
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
            text-align: center;
        }

        /* --- BOTÃO FULL SEQUENCE --- */
        .full-seq-btn {
            background: #fff;
            color: #000;
            border: 2px solid #fff;
            padding: 5px 10px;
            font-family: inherit;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            white-space: nowrap;
            animation: fadeIn 1s ease;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

            .full-seq-btn:hover {
                background: #000;
                color: #fff;
            }

            .full-seq-btn.active-full {
                background: #000;
                color: #fff;
                border-style: double;
            }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .full-seq-btn.locked {
            background: #000;
            color: #666;
            border: 1px solid #333;
            cursor: not-allowed;
            pointer-events: none;
            box-shadow: none;
            /* MUDANÇAS AQUI PARA CABER A NOVA FONTE: */
            font-size: 8px; /* Diminuímos de 10px para 8px */
            padding: 5px 6px; /* Tiramos um pouco do espaço nas laterais do botão */
            letter-spacing: 0px; /* Garante que as letras fiquem juntinhas */
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay"><h2>LOADING...</h2></div>

    <div id="help-overlay" onclick="toggleHelp()">
        <div class="help-section" style="text-align:left; margin-top: 10px;">
            <div class="help-language-switch" onclick="event.stopPropagation()">
                <button id="lang-pt-btn" class="help-language-btn" onclick="setManualLanguage('pt-BR')">PT-BR</button>
                <button id="lang-en-btn" class="help-language-btn active" onclick="setManualLanguage('en')">ENG</button>
            </div>
            <h1 class="help-title-main" id="txt-title">...</h1>
            <p class="help-subtitle" id="txt-subtitle">...</p>
            <p id="txt-close-help" style="font-size: 10px; color:#666; margin-top:10px;">[ TAP ANYWHERE TO CLOSE ]</p>
        </div>
        <div class="help-box">
            <h3 id="txt-sec1-title">...</h3>
            <p id="txt-sec1-content">...</p>
            <div class="help-formula" id="txt-formula">...</div>
            <table class="cheat-sheet">
                <thead><tr><th id="txt-note-header">NOTE</th><th id="txt-freq-header">FREQ (Hz)</th><th id="txt-length-header">WAVELENGTH (m)</th></tr></thead>
                <tbody id="notes-table-body"></tbody>
            </table>
            <p style="font-size:10px; margin-top:8px; border-top:1px dashed #555; padding-top:5px;" id="txt-octave">...</p>
        </div>
        <div class="help-box"><h3 id="txt-sec2-title">...</h3><p id="txt-sec2-content">...</p></div>
        <div class="help-box"><h3 id="txt-sec3-title">...</h3><p id="txt-sec3-content">...</p></div>
    </div>

    <div id="menu-screen">
        <h1 class="menu-title">
            <span class="menu-logo"><img src="the-sound-presence-logo.png" alt="The Sound Presence"></span>
            <span class="menu-subtitle">COOP</span>
        </h1>
        <div id="comp-list" class="comp-list"></div>
    </div>

    <div id="player-screen">
        <div class="main-layout">
            <div class="top-panel">
                <div class="nav-header">
                    <button class="back-btn" onclick="navigateBackToMenu()">[ BACK TO MENU ]</button>
                    <button class="help-btn" onclick="toggleHelp()">[ ? ]</button>
                </div>

                <div id="header-row" class="header-row">
                    <h2 id="playing-title"></h2>
                    <div id="full-seq-container"></div>
                </div>

                <div id="sessionNav" class="session-nav" style="display:none;"></div>

                <div class="scope-controls">
                    <div class="control-group">
                        <label>V-Gain: <span id="gainLabel">1.0</span></label>
                        <input type="range" id="gainSlider" min="0.5" max="10" step="0.5" value="1" />
                    </div>

                    <div class="control-group" id="zoomGroup">
                        <label>H-Zoom: <span id="zoomLabel">1.0x</span></label>
                        <input type="range" id="hZoomSlider" min="1" max="20" step="0.1" value="1" />
                        <span id="zoomWarning" class="zoom-warning">[ PAUSE TO ZOOM ]</span>
                    </div>

                    <div class="control-group" style="flex: 3; min-width: 200px;">
                        <canvas id="liveScope" height="120"></canvas>
                    </div>
                </div>

                <div class="groove-toolbar">
                    <button id="groovePlayBtn" class="play-groove-btn">[ PLAY GROOVE ]</button>
                    <div class="groove-control-group">
                        <label>RHYTHM DIVISIONS: <span id="divLabel">4</span></label>
                        <input type="range" id="divisionSlider" min="2" max="16" step="1" value="4" />
                    </div>
                </div>

                <div id="grooveContainer"></div>
            </div>

            <div class="tracks-scroll">
                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 15px; padding: 15px; border: 1px solid #666; border-radius: 8px; background-image: url('AcoEscovado.png'); background-size: cover; background-position: center;">
                    <button id="btn-sync-on" class="btn sync-active" onclick="setSyncMode(true)" style="width: auto; padding: 8px 15px; font-weight: bold; border: 2px solid #000;">
                        [ TRACK + GROOVE ]
                    </button>
                    <button id="btn-sync-off" class="btn" onclick="setSyncMode(false)" style="width: auto; padding: 8px 15px; font-weight: bold; border: 2px solid #000;">
                        [ TRACK SOLO ]
                    </button>
                </div>

                <div id="tracksContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 8192;

        // --- NOVO: TRUQUE DE LOOKAHEAD ---
        // Atrasamos o áudio da caixa de som para a animação parecer adiantada
        const syncDelay = audioCtx.createDelay(1.0);
        syncDelay.delayTime.value = 0.15; // 150 milissegundos de atraso visual (ajuste a gosto)

        // 1. Criamos o "Segurança" (Compressor)
        const masterCompressor = audioCtx.createDynamicsCompressor();

        // 2. Configuramos ele para agir como um Limiter
        masterCompressor.threshold.value = -3.0; // Começa a segurar quando chega em -3dB
        masterCompressor.knee.value = 12.0;      // Curva suave
        masterCompressor.ratio.value = 20.0;     // Taxa de compressão bem forte para não deixar passar
        masterCompressor.attack.value = 0.005;   // Reage em 5 milissegundos
        masterCompressor.release.value = 0.1;    // Solta rápido depois que o pico passa

        // 3. Conectamos: Analyser -> Delay -> Compressor -> Caixas de som
        analyser.connect(syncDelay);
        syncDelay.connect(masterCompressor);
        masterCompressor.connect(audioCtx.destination);

        // --- ESTADO GLOBAL ---
        let grooveData = null;
        let trackData = [];

        // Controle de Playback
        let activeTrack = null;
        let isPlayingMaster = false; // "PLAY ALL SESSION"
        let isPlayingFull = false;   // "PLAY FULL SEQUENCE"

        let isSyncMode = true; // Começa ativado por padrão

        function setSyncMode(enableSync) {
            isSyncMode = enableSync;
            const btnOn = document.getElementById('btn-sync-on');
            const btnOff = document.getElementById('btn-sync-off');

            if (isSyncMode) {
                btnOn.classList.add('sync-active');
                btnOff.classList.remove('sync-active');
            } else {
                btnOn.classList.remove('sync-active');
                btnOff.classList.add('sync-active');
            }
        }

        let visualGain = 1.0;
        let scopeZoom = 1.0;
        let divisions = 4;
        let scopeOffset = 0;
        let isDragging = false;
        let lastMouseX = 0;

        // --- AUDIO ENGINE ---
        let activeSources = [];
        let startTime = 0;
        let pausedAt = 0;
        let isPaused = false;
        let lastWaveformData = null;

        // --- FEATURE SECRET CODE & UNLOCKS ---
        let unlockedSessions = new Set(); // Armazena índices desbloqueados
        let bouncedSessionsBuffers = [];

        // --- CONFIGURAÇÃO ---
        let currentCompositionConfig = null;
        let currentSessionIndex = -1;
        const GLOBAL_GROOVES_FOLDER = 'grooves';
        const RESUME_STORAGE_KEY = 'coop-resume-v1';

        function saveResumeState(composition, sessionIndex) {
            try {
                sessionStorage.setItem(RESUME_STORAGE_KEY, JSON.stringify({ composition, sessionIndex }));
            } catch (error) {
                console.warn('Não foi possível salvar a composição aberta.', error);
            }
        }

        function readResumeState() {
            try {
                const saved = JSON.parse(sessionStorage.getItem(RESUME_STORAGE_KEY));
                if (saved && typeof saved.composition === 'string' &&
                    Number.isInteger(saved.sessionIndex) && saved.sessionIndex >= 0) {
                    return saved;
                }
            } catch (error) {
                console.warn('Estado salvo inválido.', error);
            }
            return null;
        }

        function clearResumeState() {
            try {
                sessionStorage.removeItem(RESUME_STORAGE_KEY);
            } catch (error) {
                console.warn('Não foi possível limpar a composição salva.', error);
            }
        }

        function applyNavigationState(state) {
            const view = state && state.view ? state.view : 'menu';
            const helpOverlay = document.getElementById('help-overlay');
            const menuScreen = document.getElementById('menu-screen');
            const playerScreen = document.getElementById('player-screen');

            helpOverlay.style.display = (view === 'help') ? 'block' : 'none';

            if (view === 'menu') {
                stopAllAudio();
                clearResumeState();
                menuScreen.style.display = 'flex';
                playerScreen.style.display = 'none';
            } else {
                menuScreen.style.display = 'none';
                playerScreen.style.display = 'block';
            }
        }

        function navigateBackToMenu() {
            history.replaceState({ view: 'menu' }, '', window.location.href);
            applyNavigationState({ view: 'menu' });
        }

        function toggleHelp() {
            const helpOverlay = document.getElementById('help-overlay');
            const isOpen = helpOverlay.style.display === 'block';

            if (isOpen) {
                if (history.state && history.state.view === 'help') {
                    history.back();
                } else {
                    helpOverlay.style.display = 'none';
                }
                return;
            }

            history.pushState({ view: 'help' }, '', window.location.href);
            helpOverlay.style.display = 'block';
        }

        window.addEventListener('popstate', (event) => {
            applyNavigationState(event.state);
        });

        let currentManualLanguage = 'en';

        function setManualLanguage(language) {
            currentManualLanguage = language;
            loadTexts();

            const ptBtn = document.getElementById('lang-pt-btn');
            const enBtn = document.getElementById('lang-en-btn');
            if (ptBtn) ptBtn.classList.toggle('active', language === 'pt-BR');
            if (enBtn) enBtn.classList.toggle('active', language === 'en');
        }

        function loadTexts() {
            if (typeof GAME_TEXTS === 'undefined') return;

            // Aceita tanto o formato bilíngue atual quanto o formato antigo/legado.
            // Assim, um manual.js em cache nunca impede o catálogo de abrir.
            const texts = GAME_TEXTS[currentManualLanguage]
                || GAME_TEXTS.en
                || GAME_TEXTS['pt-BR']
                || GAME_TEXTS;
            if (!texts || typeof texts !== 'object') return;

            const setText = (id, value) => {
                const element = document.getElementById(id);
                if (element && typeof value === 'string') element.innerHTML = value;
            };

            setText('txt-title', texts.overlayTitle);
            setText('txt-subtitle', texts.overlaySubtitle);
            setText('txt-sec1-title', texts.section1Title);
            setText('txt-sec1-content', texts.section1Content);
            setText('txt-formula', texts.formula);
            setText('txt-close-help', texts.closeHelp);

            if (texts.tableHeaders) {
                setText('txt-note-header', texts.tableHeaders.note);
                setText('txt-freq-header', texts.tableHeaders.freq);
                setText('txt-length-header', texts.tableHeaders.length);
            }

            const tbody = document.getElementById('notes-table-body');
            if (tbody && Array.isArray(texts.notesTable)) {
                tbody.innerHTML = '';
                texts.notesTable.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${row.note}</td><td>${row.freq}</td><td>${row.meters}</td>`;
                    tbody.appendChild(tr);
                });
            }

            setText('txt-octave', texts.octaveLogic);
            setText('txt-sec2-title', texts.section2Title);
            setText('txt-sec2-content', texts.section2Content);
            setText('txt-sec3-title', texts.section3Title);
            setText('txt-sec3-content', texts.section3Content);
        }

        window.onload = async () => {
            try {
                loadTexts();
            } catch (error) {
                console.warn('Manual indisponível; o catálogo continuará carregando.', error);
            }
            setZoomState(false);

            const cvs = document.getElementById('liveScope');
            const handleStart = (x) => { isDragging = true; lastMouseX = x; };
            const handleMove = (x) => {
                if (!isDragging) return;
                const delta = x - lastMouseX;
                scopeOffset += delta;
                if (scopeOffset > 0) scopeOffset = 0;
                const w = cvs.width;
                const totalWidth = w * scopeZoom;
                const minOffset = -(totalWidth - w);
                if (scopeOffset < minOffset) scopeOffset = minOffset;
                lastMouseX = x;
            };
            cvs.addEventListener('mousedown', (e) => handleStart(e.clientX));
            window.addEventListener('mouseup', () => { isDragging = false; });
            cvs.addEventListener('mousemove', (e) => handleMove(e.clientX));
            cvs.addEventListener('touchstart', (e) => handleStart(e.touches[0].clientX));
            cvs.addEventListener('touchend', () => { isDragging = false; });
            cvs.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e.touches[0].clientX); });

            try {
                const res = await fetch('composicoes.json');
                const musicas = await res.json();
                let currentModule = null;
                musicas.forEach(m => {
                    if (m.modulo && m.modulo !== currentModule) {
                        const heading = document.createElement('h2');
                        heading.className = 'module-heading';
                        heading.textContent = m.modulo;
                        document.getElementById('comp-list').appendChild(heading);
                        currentModule = m.modulo;
                    }
                    const card = document.createElement('div');
                    card.className = 'comp-card';
                    const title = document.createElement('h3');
                    title.textContent = m.nome;
                    card.appendChild(title);
                    card.onclick = async () => {
                        audioCtx.resume();
                        const didStart = await startApp(m);
                        if (didStart) {
                            history.pushState({ view: 'composition', composition: m.pasta }, '', window.location.href);
                        }
                    };
                    document.getElementById('comp-list').appendChild(card);
                });
                const saved = readResumeState();
                const composition = saved && musicas.find(m => m.pasta === saved.composition);
                if (composition && await startApp(composition, saved.sessionIndex)) {
                    history.replaceState({ view: 'composition', composition: composition.pasta }, '', window.location.href);
                } else {
                    clearResumeState();
                    history.replaceState({ view: 'menu' }, '', window.location.href);
                }
            } catch (e) { console.error("Erro ao carregar catálogo.", e); }
        };

        function setZoomState(isEnabled) {
            const zoomGroup = document.getElementById('zoomGroup');
            const slider = document.getElementById('hZoomSlider');
            const warning = document.getElementById('zoomWarning');
            if (isEnabled) {
                zoomGroup.classList.remove('control-disabled');
                slider.disabled = false;
                warning.style.display = 'none';
            } else {
                zoomGroup.classList.add('control-disabled');
                slider.disabled = true;
                warning.style.display = 'block';
            }
        }

        async function startApp(musica, initialSessionIndex = 0) {
            document.getElementById('loading').style.display = 'flex';
            try {
                stopAllAudio();
                currentSessionIndex = -1;

                const resJson = await fetch(`${musica.pasta}/settings.json`);
                currentCompositionConfig = await resJson.json();
                currentCompositionConfig._rootFolder = musica.pasta;
                currentCompositionConfig._grooveFolder = musica.grooveFolder;

                document.getElementById('playing-title').textContent =
                    musica.nome || currentCompositionConfig.compositionName;

                // Reseta lista de desbloqueios ao abrir nova composição
                unlockedSessions = new Set();
                bouncedSessionsBuffers = []; // <--- ADICIONE ESTA LINHA AQUI

                document.getElementById('full-seq-container').innerHTML = ''; // Limpa botão Full

                setupSessionNav(currentCompositionConfig.dashboardSessions);

                if (currentCompositionConfig.dashboardSessions && currentCompositionConfig.dashboardSessions.length > 0) {
                    const index = initialSessionIndex < currentCompositionConfig.dashboardSessions.length
                        ? initialSessionIndex : 0;
                    if (!await loadSession(index)) return false;
                } else {
                    throw new Error("No blocks found in JSON.");
                }

                document.getElementById('menu-screen').style.display = 'none';
                document.getElementById('player-screen').style.display = 'block';
                if (!animationStarted) {
                    animationStarted = true;
                    animate();
                }

                return true;

            } catch (err) {
                console.error(err);
                alert("Error starting: " + err.message);
                return false;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function setupSessionNav(sessions) {
            const nav = document.getElementById('sessionNav');
            nav.innerHTML = '';
            if (!sessions || sessions.length <= 1) {
                nav.style.display = 'none';
                return;
            }
            nav.style.display = 'flex';
            sessions.forEach((sess, idx) => {
                const btn = document.createElement('button');
                btn.className = 'session-btn';
                btn.textContent = `BLOCK ${idx + 1}`;
                btn.onclick = () => loadSession(idx);
                btn.id = `btn-sess-${idx}`;
                nav.appendChild(btn);
            });
        }

        async function loadSession(index) {
            if (currentSessionIndex === index) return true;

            document.getElementById('loading').style.display = 'flex';
            stopAllAudio();

            document.querySelectorAll('.session-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-sess-${index}`);
            if (activeBtn) activeBtn.classList.add('active');

            currentSessionIndex = index;
            const session = currentCompositionConfig.dashboardSessions[index];
            const localFolder = currentCompositionConfig._rootFolder;

            let loaded = false;
            try {
                let fetchPath = "";
                let displayLabel = "";

                if (currentCompositionConfig.sourceGrooveSetName) {
                    const setName = currentCompositionConfig._grooveFolder || currentCompositionConfig.sourceGrooveSetName;
                    const idx = session.grooveIndex;
                    displayLabel = `${setName} [Var ${idx}]`;
                    fetchPath = `${GLOBAL_GROOVES_FOLDER}/${setName}/${idx}.wav`;
                }
                else if (currentCompositionConfig.grooveClipNames && currentCompositionConfig.grooveClipNames[session.grooveIndex]) {
                    const gName = currentCompositionConfig.grooveClipNames[session.grooveIndex];
                    displayLabel = gName;
                    fetchPath = `${GLOBAL_GROOVES_FOLDER}/${gName}.wav`;
                }
                else {
                    displayLabel = `Groove Index ${session.grooveIndex}`;
                    fetchPath = `${GLOBAL_GROOVES_FOLDER}/${session.grooveIndex}.wav`;
                }

                let gRes = await fetch(fetchPath);
                if (!gRes.ok) {
                    const localFallback = `${localFolder}/${session.grooveIndex}.wav`;
                    gRes = await fetch(localFallback);
                }

                if (!gRes.ok) throw new Error(`Groove not found! Tried: ${fetchPath}`);

                const gBuf = await audioCtx.decodeAudioData(await gRes.arrayBuffer());

                grooveData = {
                    label: `GROOVE (${displayLabel})`,
                    buffer: gBuf,
                    waveform: computeWave(gBuf),
                    offset: 0
                };

                trackData = [];
                const trackPromises = session.tracks.map(async (t) => {
                    try {
                        const tRes = await fetch(`${localFolder}/clip_${t.globalId}.wav`);
                        if (tRes.ok) {
                            const tBuf = await audioCtx.decodeAudioData(await tRes.arrayBuffer());

                            // --- NOVO: Procura onde o som realmente começa (pula o silêncio) ---
                            let autoTrimTime = 0;
                            const channelData = tBuf.getChannelData(0);
                            // Verifica sample por sample até achar um volume audível (acima de 1%)
                            for (let i = 0; i < channelData.length; i++) {
                                if (Math.abs(channelData[i]) > 0.01) {
                                    autoTrimTime = i / tBuf.sampleRate;
                                    break;
                                }
                            }

                            return {
                                id: t.globalId,
                                label: `Track ${t.globalId}`,
                                buffer: tBuf,
                                waveform: computeWave(tBuf),
                                offset: (t.startSample || 0) / tBuf.sampleRate,
                                trimOffset: autoTrimTime // Guarda o tempo sem silêncio para o Solo
                            };
                        }
                    } catch (e) { }
                    return null;
                });

                const loadedTracks = await Promise.all(trackPromises);
                trackData = loadedTracks.filter(t => t !== null);

                // Reconfigura botão Groove Header
                const grooveBtn = document.getElementById('groovePlayBtn');
                const newBtn = grooveBtn.cloneNode(true);
                grooveBtn.parentNode.replaceChild(newBtn, grooveBtn);

                newBtn.onclick = () => {
                    // Calcula se o tempo tocado já passou da duração total do áudio
                    const elapsedTime = audioCtx.currentTime - startTime;
                    const isFinished = (activeTrack === grooveData) && (elapsedTime >= grooveData.buffer.duration);

                    // Se for o groove e AINDA não terminou, aciona o Pause/Resume
                    if (activeTrack === grooveData && !isFinished) {
                        togglePause(null, newBtn);
                    } else {
                        // Se não for o groove, ou se já tiver acabado, dá o Play do zero
                        playFromStart(grooveData, null, null, newBtn);
                    }
                };

                render();
                saveResumeState(localFolder, index);
                loaded = true;

            } catch (err) {
                console.error(err);
                alert("Block error: " + err.message);
                currentSessionIndex = -1;
            }

            document.getElementById('loading').style.display = 'none';
            return loaded;
        }

        // --- PLAYBACK ENGINE ---

        function playFromStart(data, btnPlay, btnPause, grooveBtn) {
            stopAllAudio();
            resetUI();
            setZoomState(false);
            activeTrack = data;

            let sourcesToPlay = [data];
            let useForceSync = false;

            // Se o modo Track+Groove estiver ativo e estivermos tocando uma Track (não o Groove)
            if (isSyncMode && data !== grooveData && trackData.includes(data)) {
                sourcesToPlay = [grooveData, data];
                useForceSync = true; // Força ambos a tocarem alinhados do zero
            }

            if (grooveBtn) {
                grooveBtn.textContent = "[ PLAYING GROOVE ]";
                grooveBtn.classList.add('groove-playing');
            } else if (btnPlay) {
                btnPlay.textContent = "[ PLAYING ]";
                btnPlay.classList.add('track-playing'); // <-- ADICIONAMOS ISSO
                if (btnPause) btnPause.style.display = "block";
            }

            startSources(sourcesToPlay, 0, useForceSync);
        }

        function playMaster() {
            stopAllAudio();
            resetUI();
            setZoomState(false);

            activeTrack = null;
            isPlayingMaster = true;

            const masterBtn = document.getElementById('masterPlayBtn');
            if (masterBtn) {
                masterBtn.textContent = "[ PLAYING ALL BLOCK ]";
                masterBtn.style.background = "#fff";
                masterBtn.style.color = "#000";
            }

            const allSources = [grooveData, ...trackData];
            startSources(allSources, 0, true);
        }

        // Função que junta todos os Bounces em um arquivo só
        function concatAudioBuffers(buffers) {
            // Descobre o tamanho total somando a duração de todas as sessões
            const totalLength = buffers.reduce((acc, buf) => acc + buf.length, 0);

            // Cria um buffer vazio grandão
            const result = audioCtx.createBuffer(
                buffers[0].numberOfChannels,
                totalLength,
                buffers[0].sampleRate
            );

            // Copia os dados de cada sessão em ordem para dentro do buffer grandão
            for (let channel = 0; channel < result.numberOfChannels; channel++) {
                const channelData = result.getChannelData(channel);
                let offset = 0;
                buffers.forEach(buf => {
                    channelData.set(buf.getChannelData(channel), offset);
                    offset += buf.length;
                });
            }
            return result;
        }

        async function playFullSequence() {
            // Se já estiver tocando, funciona como STOP (igual aos outros botões)
            if (isPlayingFull) {
                stopAllAudio();
                return;
            }

            stopAllAudio();
            resetUI();
            setZoomState(false);

            activeTrack = null;
            isPlayingFull = true;

            const fsBtn = document.getElementById('fullSeqBtn');
            if (fsBtn) {
                fsBtn.textContent = "[ STOP FULL SEQUENCE ]"; // Agora atua como Stop!
                fsBtn.classList.add('active-full');
            }

            // Pega as mixagens guardadas e garante que não tem nenhuma vazia
            const validBuffers = bouncedSessionsBuffers.filter(b => b != null);
            if (validBuffers.length === 0) return;

            // Cola tudo em uma faixa contínua instantaneamente
            const finalMasterBuffer = concatAudioBuffers(validBuffers);

            // Cria o tocador
            const src = audioCtx.createBufferSource();
            src.buffer = finalMasterBuffer;

            // A MÁGICA DO LOOP INFINITO AQUI
            src.loop = true;

            src.connect(analyser);
            src.start(0);

            // Adiciona na lista de fontes ativas para o Stop funcionar perfeitamente
            activeSources.push(src);
        }

        function startSources(dataList, offsetTime, forceSync, shouldLoop = false) {
            // Limpa anteriores
            activeSources.forEach(s => { try { s.stop() } catch (e) { } });
            activeSources = [];

            startTime = audioCtx.currentTime - offsetTime;

            dataList.forEach(data => {
                const src = audioCtx.createBufferSource();
                src.buffer = data.buffer;
                src.loop = shouldLoop; // <--- NOVA LINHA: Ativa o Loop se pedido

                // --- SEPARAÇÃO DO ÁUDIO ---
                if (data === grooveData) {
                    // O groove pula o osciloscópio, mas PASSA PELO DELAY pra manter a sincronia!
                    src.connect(syncDelay);
                } else {
                    // As tracks passam pelo analyser (que depois vai para o delay automaticamente)
                    src.connect(analyser);
                }

                let startPoint = 0;
                if (forceSync) {
                    // MODO SYNC (Track + Groove): Começa do zero absoluto, mantendo 
                    // o silêncio original para alinhar no tempo do Groove.
                    startPoint = 0 + offsetTime;
                } else {
                    // MODO SOLO: Pula o silêncio e vai direto pra onde tem som!
                    const baseOffset = (data.trimOffset !== undefined) ? data.trimOffset : data.offset;
                    startPoint = baseOffset + offsetTime;
                }

                // Se for loop, não precisamos checar duração vs startPoint com tanto rigor
                if (shouldLoop || startPoint < data.buffer.duration) {
                    src.start(0, startPoint);
                    activeSources.push(src);
                }
            });

            // Se NÃO for loop, mantém o comportamento de acabar sozinho.
            if (!shouldLoop && activeSources.length > 0) {
                // MÁGICA: Acha o áudio mais longo que está tocando agora para ser a referência
                let longestSource = activeSources[0];
                let maxDuration = 0;

                activeSources.forEach(src => {
                    if (src.buffer && src.buffer.duration > maxDuration) {
                        maxDuration = src.buffer.duration;
                        longestSource = src;
                    }
                });

                // Só reseta a interface quando o áudio mais longo acabar de verdade
                longestSource.onended = () => {
                    if (!isPaused) {
                        activeSources = [];
                        resetUI();
                        activeTrack = null;
                        isPlayingMaster = false;
                        isPlayingFull = false;
                    }
                };
            }
        }

        function togglePause(btnPause, grooveBtn) {
            if (activeSources.length === 0 && !isPaused) return;

            if (isPaused) {
                // --- RESUME ---
                setZoomState(false);

                if (isPlayingFull) {
                    // Resume Full Sequence (precisa recarregar/re-tocar do ponto)
                    // Obs: Como o buffer já foi decodificado, não temos ele salvo globalmente
                    // Para simplificar, o Play Full não suporta Resume perfeito se não salvarmos o buffer.
                    // Mas como o startSources usa dataList, e dataList foi passado localmente...
                    // *Solução Simples*: Se pausar o Full, ele volta do início ou precisamos salvar o buffer global.
                    // Vou implementar RESTART para o Full se pausado, ou impedir pause.
                    // Melhor: Vamos dar stop e pedir play de novo para o Full para evitar complexidade de memória.
                    alert("Pause is not supported in Full Sequence (Optimized Memory). Press Play again.");
                    stopAllAudio();
                    return;

                } else if (isPlayingMaster) {
                    const allSources = [grooveData, ...trackData];
                    startSources(allSources, pausedAt, true);
                    const mb = document.getElementById('masterPlayBtn');
                    if (mb) { mb.textContent = "[ PLAYING ALL BLOCK ]"; mb.style.background = "#fff"; mb.style.color = "#000"; }

                } else if (activeTrack) {
                    let sourcesToPlay = [activeTrack];
                    let useForceSync = false;

                    if (isSyncMode && activeTrack !== grooveData && trackData.includes(activeTrack)) {
                        sourcesToPlay = [grooveData, activeTrack];
                        useForceSync = true;
                    }

                    startSources(sourcesToPlay, pausedAt, useForceSync);
                }

                isPaused = false;

                if (btnPause) btnPause.textContent = "[ PAUSE ]";
                if (grooveBtn) {
                    grooveBtn.textContent = "[ PLAYING GROOVE ]";
                    grooveBtn.classList.add('groove-playing');
                }

            } else {
                // --- PAUSE ---
                stopAllAudio(true);
                isPaused = true;

                if (btnPause) btnPause.textContent = "[ RESUME ]";
                if (grooveBtn) {
                    grooveBtn.textContent = "[ RESUME GROOVE ]";
                    grooveBtn.classList.remove('groove-playing');
                }

                if (isPlayingMaster) {
                    const mb = document.getElementById('masterPlayBtn');
                    if (mb) { mb.textContent = "[ RESUME ALL ]"; mb.style.background = "#000"; mb.style.color = "#fff"; }
                }
                if (isPlayingFull) {
                    const fb = document.getElementById('fullSeqBtn');
                    if (fb) { fb.textContent = "[ RESUME FULL ]"; }
                }

                setZoomState(true);
            }
        }

        function stopAllAudio(isPauseAction = false) {
            activeSources.forEach(src => {
                try { src.onended = null; src.stop(); } catch (e) { }
            });
            activeSources = [];

            if (!isPauseAction) {
                isPaused = false;
                pausedAt = 0;
                lastWaveformData = null;
                setZoomState(false);
                activeTrack = null;
                isPlayingMaster = false;
                isPlayingFull = false;
                resetUI();
            } else {
                pausedAt = audioCtx.currentTime - startTime;
            }
        }

        function resetUI() {
            document.querySelectorAll('.btn').forEach(b => {
                // Adicionei b.id !== 'btn-sync-on' e 'btn-sync-off' para eles escaparem do reset!
                if (!b.classList.contains('back-btn') && !b.classList.contains('btn-pause') && b.id !== 'btn-sync-on' && b.id !== 'btn-sync-off') {
                    b.textContent = "[ PLAY ]";
                    b.classList.remove('track-playing'); // <-- TIRA O FUNDO PRETO
                    b.blur(); // <-- TIRA O "HOVER" PRESO DO CELULAR
                }
            });

            document.querySelectorAll('.btn-pause').forEach(b => { b.style.display = "none"; b.textContent = "[ PAUSE ]"; });

            const gBtn = document.getElementById('groovePlayBtn');
            if (gBtn) {
                gBtn.textContent = "[ PLAY GROOVE ]";
                gBtn.classList.remove('groove-playing');
            }

            const mBtn = document.getElementById('masterPlayBtn');
            if (mBtn) {
                mBtn.textContent = "[ PLAY ALL BLOCK ]";
                mBtn.style.background = "#000";
                mBtn.style.color = "#fff";
            }

            const fBtn = document.getElementById('fullSeqBtn');
            if (fBtn) {
                // Só volta o texto para Play Full Sequence se ele NÃO estiver bloqueado!
                if (!fBtn.classList.contains('locked')) {
                    fBtn.textContent = "[ PLAY FULL SEQUENCE ]";
                    fBtn.classList.remove('active-full');
                }
            }

            const cursor = document.getElementById('cursor-g');
            if (cursor) cursor.style.display = 'none';
        }

        function computeWave(buffer) {
            const data = buffer.getChannelData(0);
            const step = Math.ceil(data.length / 400);
            const wave = new Float32Array(400);
            for (let i = 0; i < 400; i++) {
                let max = 0;
                for (let j = 0; j < step; j++) {
                    const v = Math.abs(data[i * step + j]);
                    if (v > max) max = v;
                }
                wave[i] = max;
            }
            return wave;
        }

        function render() {
            const gCont = document.getElementById('grooveContainer');
            const tCont = document.getElementById('tracksContainer');
            gCont.innerHTML = ''; tCont.innerHTML = '';

            // --- ATUALIZA CABEÇALHO (BOTÃO FULL SEQUENCE) ---
            const headerCont = document.getElementById('full-seq-container');
            if (headerCont) {
                headerCont.innerHTML = '';
                const totalSessions = currentCompositionConfig.dashboardSessions ? currentCompositionConfig.dashboardSessions.length : 0;

                if (totalSessions > 0) {
                    const btnFull = document.createElement('button');
                    btnFull.id = 'fullSeqBtn';
                    btnFull.className = 'full-seq-btn';

                    if (unlockedSessions.size === totalSessions) {
                        // --- MODO DESBLOQUEADO ---
                        // Se estiver tocando, mostra STOP, senão PLAY
                        if (isPlayingFull) {
                            btnFull.textContent = '[ STOP FULL SEQUENCE (LOOP) ]';
                            btnFull.classList.add('active-full');
                        } else {
                            btnFull.textContent = '[ PLAY FULL SEQUENCE ]';
                        }

                        // O clique alterna entre tocar ou parar (gerenciado dentro da playFullSequence)
                        btnFull.onclick = () => playFullSequence();
                    } else {
                        // --- MODO BLOQUEADO ---
                        btnFull.classList.add('locked');
                        btnFull.textContent = '[ PLAY ALL SEQUENCE LOCKED: COMPLETE ALL BLOCKS ]';
                    }

                    headerCont.appendChild(btnFull);
                }
            }

            // Render Groove
            if (grooveData) {
                const row = document.createElement('div');
                row.className = 'track-row';
                // Usando o ghost-block: no desktop alinha perfeito com as tracks, no celular some pra não esticar a altura!
                row.innerHTML = `
                <div class="track-info ghost-block">
                    <div class="track-label">GROOVE</div>
                </div>
                <div class="canvas-container">
                    <canvas id="canv-g" width="800" height="100"></canvas>
                    <div id="cursor-g" class="cursor-groove"></div>
                </div>
                <div class="btn-group ghost-block">
                    <button class="btn">[ PLAY ]</button>
                    <button class="btn btn-pause">[ PAUSE ]</button>
                </div>`;
                gCont.appendChild(row);
                updateCanvas(grooveData, true);
            }

            // Render Tracks
            trackData.forEach(data => {
                const row = document.createElement('div');
                row.className = 'track-row';
                row.innerHTML = `
                <div class="track-info">
                    <div class="track-label">${data.label}</div>
                </div>
                <div class="canvas-container">
                    <canvas id="canv-${data.id}" width="800" height="100"></canvas>
                </div>
                <div class="btn-group"></div>`;

                const btnPlay = document.createElement('button');
                btnPlay.className = 'btn'; btnPlay.textContent = '[ PLAY ]';
                const btnPause = document.createElement('button');
                btnPause.className = 'btn btn-pause'; btnPause.textContent = '[ PAUSE ]';

                btnPlay.onclick = () => playFromStart(data, btnPlay, btnPause, null);
                btnPause.onclick = () => togglePause(btnPause, null);

                row.querySelector('.btn-group').append(btnPlay, btnPause);
                tCont.appendChild(row);
                updateCanvas(data, false);
            });

            // --- RENDER DO MASTER / BOSS (PLAY ALL SESSION) ---
            const masterContainer = document.createElement('div');
            masterContainer.className = 'master-track-container';

            // 1. Gera o código esperado para ESSA sessão específica
            // Tenta pegar do config, ou usa o título da tela como fallback
            const compName = (currentCompositionConfig && currentCompositionConfig.compositionName)
                ? currentCompositionConfig.compositionName
                : document.getElementById('playing-title').textContent;

            const expectedCode = generateCoopCode(compName, currentSessionIndex);

            // Debug no console pra você testar fácil no navegador
            console.log(`[COOP] Sessão ${currentSessionIndex} (${compName}) -> Código Esperado: ${expectedCode}`);

            if (!unlockedSessions.has(currentSessionIndex)) {
                masterContainer.innerHTML = `
                <div class="master-locked">
                    <span>COMPLETE THE BLOCK TO RECEIVE THE CODE</span>
                    <br><br>
                    > <input type="text" class="master-input" maxlength="4" placeholder="0000" />
                </div>
            `; // Note que mudei maxlength para 4 e placeholder para 0000

                const input = masterContainer.querySelector('input');

                // Lógica de verificação atualizada
                input.oninput = (e) => {
                    if (e.target.value === expectedCode) {
                        unlockedSessions.add(currentSessionIndex);
                        bounceCurrentSession(currentSessionIndex);
                        render(); // Redesenha para mostrar desbloqueado
                    }
                };
            } else {
                // ... (O bloco 'else' do desbloqueado continua igual) ...
                masterContainer.innerHTML = `
                <div class="master-unlocked">
                    <div class="master-title">★ BLOCK COMPLETE ★</div>
                    <div class="canvas-container" style="margin: 0 auto; height: 100px;">
                        <canvas id="canv-master" width="800" height="100"></canvas>
                    </div>
                    <button id="masterPlayBtn" class="btn" style="width:100%; margin-top:10px; font-weight:bold; border:1px solid #fff; background: #000; color: #fff;">
                             [ PLAY ALL BLOCK ]
                       </button>
                </div>
            `;
                tCont.appendChild(masterContainer);

                const mBtn = masterContainer.querySelector('#masterPlayBtn');
                mBtn.onclick = () => playMaster();

                setTimeout(() => {
                    const cvsM = document.getElementById('canv-master');
                    if (cvsM && grooveData) {
                        const ctx = cvsM.getContext('2d');
                        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 800, 100);
                        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.beginPath();
                        const wave = grooveData.waveform;
                        const step = 800 / wave.length;
                        wave.forEach((v, i) => {
                            ctx.moveTo(i * step, 50 - v * 40);
                            ctx.lineTo(i * step, 50 + v * 40);
                        });
                        ctx.stroke();
                    }
                }, 50);
                return;
            }
            tCont.appendChild(masterContainer);
        }

        function updateCanvas(data, isGroove) {
            const canvas = document.getElementById(`canv-${isGroove ? 'g' : data.id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            const mainColor = isGroove ? '#fff' : '#000';
            const marginY = 0;
            const boxHeight = h;

            ctx.strokeStyle = isGroove ? '#fff' : '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, marginY, w, boxHeight);

            const step = w / data.waveform.length;
            const waveCenter = h / 2;
            const waveMaxAmp = boxHeight * 0.8;

            ctx.beginPath();
            data.waveform.forEach((v, i) => {
                const amp = v * (waveMaxAmp / 2) * visualGain;
                ctx.moveTo(i * step, waveCenter - amp);
                ctx.lineTo(i * step, waveCenter + amp);
            });
            ctx.stroke();

            if (isGroove) {
                ctx.strokeStyle = mainColor;
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                for (let i = 1; i < divisions; i++) {
                    const x = (w / divisions) * i;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, h);
                    ctx.stroke();
                }
                ctx.setLineDash([]);
            }
        }

        let animationStarted = false;

        function animate() {
            requestAnimationFrame(animate);

            // LÓGICA DO CURSOR
            // 1. Descobrimos se estamos tocando uma track no modo sincronizado
            const isPlayingSync = isSyncMode && activeTrack && activeTrack !== grooveData;

            // 2. O cursor aparece se: for o Groove solo, for o Play All (Master) OU for o modo Sync
            const shouldShowCursor = !isPaused && activeSources.length > 0 &&
                ((activeTrack === grooveData) || isPlayingMaster || isPlayingSync);

            if (shouldShowCursor && grooveData) {
                // Desconta o tempo do delay para o cursor bater cravado com a caixa de som
                let adjustedTime = (audioCtx.currentTime - startTime) - syncDelay.delayTime.value;
                if (adjustedTime < 0) adjustedTime = 0; // Evita valores negativos no comecinho

                const progress = adjustedTime / grooveData.buffer.duration;
                const el = document.getElementById('cursor-g');
                if (el) {
                    el.style.display = 'block';
                    el.style.left = (Math.min(progress, 1) * 100) + '%';
                }
            }
            // 3. Só esconde o cursor se estivermos tocando uma track e NÃO estivermos no modo Sync
            else if (!isPaused && activeTrack && activeTrack !== grooveData && !isPlayingMaster && !isPlayingSync) {
                const el = document.getElementById('cursor-g');
                if (el) el.style.display = 'none';
            }

            // --- OSCILOSCÓPIO ---
            const cvs = document.getElementById('liveScope');
            const sCtx = cvs.getContext('2d');
            const w = 800;
            const h = cvs.height;

            const dataArr = new Uint8Array(analyser.frequencyBinCount);

            if (!isPaused && activeSources.length > 0) {
                analyser.getByteTimeDomainData(dataArr);
                lastWaveformData = new Uint8Array(dataArr);
            } else if (isPaused && lastWaveformData) {
                dataArr.set(lastWaveformData);
            } else {
                sCtx.fillStyle = '#000'; sCtx.fillRect(0, 0, w, h);
                return;
            }

            sCtx.fillStyle = '#000';
            sCtx.fillRect(0, 0, w, h);

            const rulerHeight = 20;
            const waveAreaHeight = h - rulerHeight;
            const waveCenter = waveAreaHeight / 2;

            sCtx.fillStyle = '#111';
            sCtx.fillRect(0, waveAreaHeight, w, rulerHeight);

            const SPEED_OF_SOUND = 343;
            const totalSeconds = dataArr.length / audioCtx.sampleRate;
            const totalMeters = totalSeconds * SPEED_OF_SOUND;
            const basePixelsPerMeter = w / totalMeters;
            const scaledPixelsPerMeter = basePixelsPerMeter * scopeZoom;

            sCtx.lineWidth = 1;
            sCtx.font = "bold 10px Courier New";
            sCtx.textAlign = "left";

            let stepSize = 1;
            let precision = 0;
            if (scaledPixelsPerMeter > 200) { stepSize = 0.1; precision = 1; }
            else if (scaledPixelsPerMeter > 100) { stepSize = 0.5; precision = 1; }
            else if (scaledPixelsPerMeter > 50) { stepSize = 0.5; precision = 1; }

            const maxVisibleMeters = (w - scopeOffset) / scaledPixelsPerMeter;

            for (let m = 0; m < maxVisibleMeters + stepSize; m += stepSize) {
                m = Math.round(m * 100) / 100;
                if (m === 0) continue;
                const xPos = (m * scaledPixelsPerMeter) + scopeOffset;
                if (xPos < 0) continue;
                if (xPos > w) break;

                sCtx.strokeStyle = '#fff';
                sCtx.beginPath();
                sCtx.moveTo(xPos, waveAreaHeight);
                sCtx.lineTo(xPos, h);
                sCtx.stroke();

                let drawText = true;
                if (stepSize === 0.1) {
                    if (Math.round(m * 10) % 5 !== 0) drawText = false;
                }

                if (drawText) {
                    sCtx.fillStyle = '#fff';
                    sCtx.fillText(m.toFixed(precision) + "m", xPos + 2, h - 5);
                }
            }

            sCtx.textAlign = "right";
            sCtx.fillStyle = "#fffacd";
            sCtx.fillText(`SCOPE: ${scopeZoom.toFixed(1)}x`, w - 5, 12);

            sCtx.save();
            sCtx.beginPath();
            sCtx.rect(0, 0, w, waveAreaHeight);
            sCtx.clip();

            sCtx.strokeStyle = '#fff';
            sCtx.lineWidth = 2;
            sCtx.beginPath();

            const slice = (w / dataArr.length) * scopeZoom;
            let x = scopeOffset;

            for (let i = 0; i < dataArr.length; i++) {
                const yCorrected = waveCenter + ((dataArr[i] - 128) / 128) * waveCenter * visualGain;
                if (x >= -slice && x <= w + slice) {
                    if (i === 0) sCtx.moveTo(x, yCorrected);
                    else sCtx.lineTo(x, yCorrected);
                } else if (i === 0) {
                    sCtx.moveTo(x, yCorrected);
                }
                x += slice;
            }
            sCtx.stroke();
            sCtx.restore();
        }

        document.getElementById('divisionSlider').oninput = (e) => {
            divisions = e.target.value;
            document.getElementById('divLabel').textContent = divisions;
            render();
        };
        document.getElementById('gainSlider').oninput = (e) => {
            visualGain = e.target.value;
            document.getElementById('gainLabel').textContent = visualGain;
            render();
        };
        document.getElementById('hZoomSlider').oninput = (e) => {
            scopeZoom = parseFloat(e.target.value);
            document.getElementById('zoomLabel').textContent = scopeZoom.toFixed(1) + "x";
            scopeOffset = 0;
        };

        // --- FUNÇÃO DO CÓDIGO COOP (Mesma lógica da Unity) ---
        function generateCoopCode(compositionName, sessionIndex) {
            if (!compositionName) return "0000";

            // Limpeza: Trim e UpperCase
            const name = compositionName.trim().toUpperCase();
            const len = name.length;

            if (len === 0) return "0000";

            // D1: Tamanho do Nome
            const d1 = len % 10;

            // D2: Letra Rotativa (ASCII code % 10)
            // charCodeAt(i) é o equivalente ao (int)char do C#
            const charCodeAtIndex = name.charCodeAt(sessionIndex % len);
            const d2 = charCodeAtIndex % 10;

            // D3: Par/Ímpar
            let d3 = 0;
            if (sessionIndex % 2 === 0) {
                // Par: Primeira letra + index
                const firstCharVal = name.charCodeAt(0);
                d3 = (firstCharVal + sessionIndex) % 10;
            } else {
                // Ímpar: Última letra + index
                const lastCharVal = name.charCodeAt(len - 1);
                d3 = (lastCharVal + sessionIndex) % 10;
            }

            // D4: Pulo
            const d4 = (sessionIndex * 7) % 10;

            return `${d1}${d2}${d3}${d4}`;
        }

        async function bounceCurrentSession(index) {
            if (!grooveData) return;

            // Pega a duração do groove, que será o tamanho exato do nosso "Bounce"
            const duration = grooveData.buffer.duration;
            const sampleRate = audioCtx.sampleRate;

            // Cria o "Estúdio Offline" invisível
            const offlineCtx = new OfflineAudioContext(2, sampleRate * duration, sampleRate);

            // Toca o Groove lá dentro
            const gSrc = offlineCtx.createBufferSource();
            gSrc.buffer = grooveData.buffer;
            gSrc.connect(offlineCtx.destination);
            gSrc.start(0);

            // Toca as Tracks lá dentro (todas sincronizadas no tempo 0, igual ao master)
            trackData.forEach(t => {
                const tSrc = offlineCtx.createBufferSource();
                tSrc.buffer = t.buffer;
                tSrc.connect(offlineCtx.destination);
                tSrc.start(0);
            });

            // Renderiza e salva o buffer pesando quase nada na memória RAM!
            const renderedBuffer = await offlineCtx.startRendering();
            bouncedSessionsBuffers[index] = renderedBuffer;
            console.log(`[SINESTÉTICA] Sessão ${index} mixada e salva na memória!`);
        }
    </script>
